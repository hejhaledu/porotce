<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05072b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Artimo Counter – Porotce</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
<style>
:root{
  --bg:#05072b;--glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.09);--glass3:rgba(255,255,255,.14);
  --stroke:rgba(255,255,255,.08);--stroke2:rgba(255,255,255,.15);
  --text:#f4f5fb;--text2:rgba(232,235,255,.62);--text3:rgba(232,235,255,.38);
  --accent:#f5d3a8;--ink:#05072b;--blue:#5b8cff;--green:#34c759;--red:#ff5a5f;--orange:#ff9f0a;--gray:#8e8e93;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font);font-size:15px;color:var(--text);background:radial-gradient(900px 500px at 0% -10%,#111766 0%,transparent 60%),var(--bg);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button,input,select{font-family:inherit;color:inherit}
.hidden{display:none!important}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
.hlogo{height:26px;width:auto;flex:0 0 auto;opacity:.95}
.biglogo{height:64px;width:auto;display:block;margin:0 0 16px}
.scol{display:flex;flex-direction:column;align-items:flex-start;gap:4px;flex:0 0 auto}
.srow{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);line-height:1}
.srow.ready{color:#5fe08a}
.medal{position:absolute;top:6px;left:7px;width:13px;height:13px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.4)}
.medal.m1{background:radial-gradient(circle at 35% 30%,#fff3c4,#f2c14e 55%,#c89211)}
.medal.m2{background:radial-gradient(circle at 35% 30%,#ffffff,#cfd3dd 55%,#8f95a5)}
.medal.m3{background:radial-gradient(circle at 35% 30%,#ffe0c7,#d9925e 55%,#9c5a2c)}
.simbar{display:flex;align-items:center;gap:8px;margin:4px 0 10px;padding:8px 10px;border-radius:11px;background:rgba(91,140,255,.16);border:1px solid rgba(91,140,255,.35);font-size:13px}
.simbar b{color:#9db8ff}
.simbar .btn{height:28px;font-size:12px;padding:0 10px;border-radius:8px;margin-left:auto}
.simbtns{display:flex;gap:8px;margin-top:10px}
.kicker{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.home h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.01em;line-height:1.2}
.home .sub{color:var(--text2);font-size:14px;min-height:18px}
.letters.named{grid-template-columns:repeat(2,1fr)}
.letters.named button{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;text-align:left;font-size:14px;font-weight:600}
.letters.named button i{font-style:normal;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.1);display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;flex:0 0 auto}
.letters.named button.on i{background:rgba(5,7,43,.18)}
.letters.named button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard{display:block;width:100%;text-align:left;margin-top:10px;padding:14px 16px;border-radius:16px;border:1px solid var(--stroke);background:var(--glass);box-shadow:0 4px 16px rgba(0,0,0,.25)}
.ccard b{display:block;font-size:17px;margin-bottom:4px}
.ccard .m{font-size:13px;color:var(--text2);line-height:1.45}
.ccard.other{opacity:.5;box-shadow:none;background:transparent}
.ccard.other b{font-size:15px}
.ccard.live{border-color:var(--accent);background:rgba(245,211,168,.1);box-shadow:0 0 0 1px rgba(245,211,168,.4),0 8px 30px rgba(245,211,168,.12)}
.cbadge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:11px;font-size:12px;font-weight:600;margin-bottom:8px;background:rgba(255,255,255,.08);color:var(--text2)}
.ccard.live .cbadge{background:var(--accent);color:var(--ink)}
.ccard.live .cbadge .dot{background:var(--ink);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.credit{text-align:center;font-size:11px;color:var(--text3);padding:26px 0 6px;letter-spacing:.02em}
.toasts{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:90;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;padding:11px 14px;border-radius:14px;background:#3a1420;border:1px solid rgba(255,90,95,.55);color:#ffd5d6;font-size:14px;line-height:1.4;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.toast b{display:block}
.backbtn{height:34px;padding:0 12px;border-radius:10px;border:none;background:var(--glass2);font-size:14px;font-weight:600}
.simbtns .btn{flex:1;height:44px;font-size:14px}
.btn{height:40px;padding:0 16px;border-radius:11px;border:none;background:var(--glass2);font-size:15px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s,opacity .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.blue{background:var(--blue);color:#fff}
.in{height:44px;width:100%;padding:0 12px;border-radius:11px;border:1px solid transparent;background:rgba(255,255,255,.07);font-size:16px;outline:none}
.in:focus{border-color:var(--blue)}
select.in option{background:#11154a}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gray);display:inline-block;flex:0 0 auto}
.dot.ok{background:var(--green)}.dot.wait{background:var(--orange)}.dot.bad{background:var(--red)}.dot.saved{background:var(--blue)}

#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(5,7,43,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--stroke)}
.jbadge{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--ink);font-weight:800;font-size:21px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.who{flex:1;min-width:0}
.who b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.bar{padding:8px 14px 0}
.tabs{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;border:none;background:var(--glass);color:var(--text2);font-size:14px;font-weight:600}
.tab.sel{background:var(--accent);color:var(--ink)}
.tab.sel .dot{box-shadow:0 0 0 1.5px rgba(5,7,43,.4)}
.content{flex:1;overflow-y:auto;padding:6px 14px 14px;position:relative;-webkit-overflow-scrolling:touch}
.instr{font-size:13px;color:var(--text2);margin:2px 0 10px;line-height:1.45}
.instr b{color:var(--text)}
.ghead{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px}
.ghead:first-child{margin-top:4px}
.ghead::after{content:"";flex:1;height:1px;background:var(--stroke2)}
.ghead .gc{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.couple{position:relative;height:var(--ch,66px);border-radius:14px;border:1px solid var(--stroke);background:var(--glass);font-size:calc(var(--ch,66px) * .38);font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y;transition:background .12s,color .12s,transform .12s;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.couple.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.couple::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:transparent}
.couple.mg::after{background:var(--green)}
.couple.mr::after{background:var(--red)}
.couple:disabled{opacity:.5}
.couple.wd{opacity:.32;text-decoration:line-through;pointer-events:none}
.couple.wd::after{content:"odstoupil";position:absolute;bottom:3px;left:0;right:0;font-size:9px;font-weight:600;text-decoration:none;letter-spacing:.02em}
.fbtn .wdl{position:absolute;bottom:2px;left:0;right:0;font-size:9px;font-weight:600;color:#ffb84d}
/* finále */
.fin{position:relative;display:grid;grid-template-columns:1fr 1fr;column-gap:34%;height:100%;min-height:300px}
.fcol{display:grid;gap:8px}
.fbtn{position:relative;border-radius:14px;border:1px solid var(--stroke);background:var(--glass);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;min-height:42px;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:background .12s,box-shadow .12s}
.fbtn.pl{font-size:19px;color:var(--text2)}
.fbtn.linked{background:var(--glass3);color:var(--text)}
.fbtn.pl.linked{background:rgba(245,211,168,.16);color:var(--accent);border-color:rgba(245,211,168,.35)}
.fbtn.sel{box-shadow:0 0 0 3px var(--blue);background:rgba(91,140,255,.22)}
.fbtn .sm{position:absolute;top:4px;right:7px;font-size:12px;font-weight:700;color:var(--accent)}
.fbtn:disabled{opacity:.5}
.fin svg{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.fin .ln{fill:none;stroke:url(#lnGrad);stroke-width:2.2;stroke-linecap:round}
.fin .ln-glow{fill:none;stroke:rgba(245,211,168,.18);stroke-width:7;stroke-linecap:round}
.fin .ln.hl{stroke:var(--blue);stroke-width:2.8}
.fin .ln-glow.hl{stroke:rgba(91,140,255,.28)}
.fin .end{fill:var(--accent);stroke:#05072b;stroke-width:2}
.fin .end.hl{fill:var(--blue)}
.fin svg .new{animation:lnIn .25s ease-out}
@keyframes lnIn{from{opacity:0}}
footer{padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:rgba(5,7,43,.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--stroke)}
.frow{display:flex;gap:8px;align-items:center}
.counter{font-size:20px;font-weight:700;min-width:62px;letter-spacing:-.01em}
.send{flex:1;height:50px;font-size:17px;font-weight:700;border-radius:13px}
.status{margin-top:8px;font-size:13px;display:flex;align-items:center;gap:7px;min-height:18px;color:var(--text2)}
.status .sp{flex:1}
.btn.qr{height:28px;padding:0 10px;font-size:12px;border-radius:8px}
.banner{margin:0 0 10px;padding:9px 12px;border-radius:11px;font-size:13px}
.banner.locked{background:rgba(255,90,95,.14);color:#ff8a8d}
.readyok{display:flex;align-items:center;gap:6px;font-size:12px;color:#5fe08a;margin-bottom:6px}
.center{text-align:center;padding:50px 18px;color:var(--text2);line-height:1.55}
.center h2{color:var(--text);font-size:23px;margin:0 0 6px;letter-spacing:-.01em}
.center .btn{width:100%;max-width:340px;height:56px;font-size:18px;border-radius:15px;margin-top:22px}
.setup{max-width:420px;margin:0 auto;padding:30px 20px;overflow:auto;height:100%}
.setup h1{font-size:22px;margin:0 0 4px}
.setup label{display:block;font-size:13px;color:var(--text2);margin:16px 0 6px}
.letters{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.letters button{height:48px;border-radius:12px;border:none;background:var(--glass2);font-size:19px;font-weight:700}
.letters button.on{background:var(--accent);color:var(--ink)}
.overlay{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{width:100%;max-width:420px;background:#151a52;border:1px solid var(--stroke2);border-radius:20px;padding:18px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet p{margin:0 0 10px;color:var(--text2);font-size:13px;line-height:1.45}
.qrwrap{background:#fff;border-radius:14px;padding:10px;display:inline-block}
.qrwrap svg{display:block;width:min(78vw,330px);height:auto}
</style>
</head>
<body>

<div id="boot" class="center"><b style="color:var(--text)">Načítám aplikaci porotce…</b><div id="bootMsg" style="margin-top:14px;font-size:14px"></div></div>
<script>
  function bootError(msg){ var el=document.getElementById("bootMsg"); if(el){ el.innerHTML += '<div style="color:#ff8a8d;margin-top:8px">'+String(msg).replace(/</g,"&lt;")+'</div>'; } }
  addEventListener("error", function(e){ if (e.target && e.target.tagName === "LINK") return; bootError("Chyba: " + (e.message || (e.target && e.target.src) || "neznámá")); }, true);
  addEventListener("unhandledrejection", function(e){ bootError("Chyba: " + (e.reason && (e.reason.code || e.reason.message) || e.reason)); });
  if (location.protocol === "file:" || location.protocol === "content:") bootError("Stránka je otevřená jako soubor. Otevřete ji přes webovou adresu (https://…).");
  setTimeout(function(){ var b=document.getElementById("boot"); if (b && b.style.display !== "none") bootError("Aplikace se nenačetla do 8 s. Zkontrolujte internet a že je stránka otevřená přes https:// v Safari nebo Chrome."); }, 8000);
</script>

const DANCE_CODES = ["W","T","V","F","Q","S","C","R","P","J","K"];
const intArr = a => Array.isArray(a) && a.length > 0 && a.every(n => Number.isInteger(n) && n > 0);
function validRound(r) {
  return r && ["prelim", "final"].includes(r.type) && intArr(r.couples) && new Set(r.couples).size === r.couples.length
    && Array.isArray(r.dances) && r.dances.length && r.dances.every(d => DANCE_CODES.includes(d)) && Array.isArray(r.judges)
    && (r.type === "final" || (Number.isInteger(r.required) && r.required > 0))
    && (r.groups == null || (Array.isArray(r.groups) && r.groups.every(g => intArr(g?.couples))));
}

const params = new URLSearchParams(location.search);
let comp = (params.get("c") || "").toLowerCase();       // akce z odkazu (jen pro zvýraznění)
const linkComp = comp;
let comps = new Map(), screen = "home";
let judge = (params.get("j") || store.get("ac_j_judge") || "").toUpperCase();

let compDoc = {}, me = {};
let rounds = new Map(), rid = null, dance = null;
let sheets = new Map();
const drafts = new Map();
let unsubSheets = null;
let online = navigator.onLine, serverConnected = false;
let selC = null, selP = null;            // finále: vybraný pár / místo
const settings = () => DEFAULTS;
let sim = null;                          // simulátor: { from: "home"|"live" }
let liveRounds = new Map(), liveMe = {}, allRounds = [];

// ===================== HOMESCREEN A SEZNAM AKCÍ =====================
const compState = c => c.finishedAt ? "done" : c.startedAt ? "live" : "ready";
const juryLetters = c => Object.keys(c?.jury || {}).sort();
// akce pro titulek homescreenu: z odkazu, jinak právě probíhající
function featuredComp() {
  if (linkComp && comps.has(linkComp)) return comps.get(linkComp);
  const live = [...comps.values()].filter(c => compState(c) === "live");
  return live.length === 1 ? live[0] : null;           // při více probíhajících soutěžích žádnou nevnucovat
}
function showScreen(name) {
  screen = name;
  $("boot").style.display = "none";
  $("home").classList.toggle("hidden", name !== "home");
  $("list").classList.toggle("hidden", name !== "list");
  $("app").classList.toggle("hidden", name !== "app");
}
function showHome() { showScreen("home"); renderHome(); }
function renderHome() {
  const f = featuredComp(), loaded = compsLoaded;
  const liveN = [...comps.values()].filter(c => compState(c) === "live").length;
  $("homeTitle").textContent = f ? (f.name || f.id) : loaded ? "Artimo Counter" : "Načítám akce…";
  $("homeSub").textContent = f ? (compState(f) === "live" ? "Akce právě probíhá" : compState(f) === "ready" ? "Akce se připravuje" : "Akce je ukončená")
    : loaded ? (liveN > 1 ? `Právě probíhají ${liveN} akce – vyberte své písmeno` : "Vyberte své písmeno porotce") : "";
  const named = f && juryLetters(f).length && !allLetters;
  const letters = named ? juryLetters(f) : "ABCDEFGHIJKLMNOPQRSTUVWX".split("");
  $("hLetters").className = "letters" + (named ? " named" : "");
  $("hLetters").innerHTML = letters.map(l => named
    ? `<button data-l="${l}" class="${l === judge ? "on" : ""}"><i>${l}</i><span>${esc(f.jury[l] || "Porotce " + l)}</span></button>`
    : `<button data-l="${l}" class="${l === judge ? "on" : ""}">${l}</button>`).join("")
    + (named ? `<button data-all="1" style="grid-column:1/-1;height:40px;justify-content:center;color:var(--text2)">Jiné písmeno…</button>` : "");
  $("hGo").disabled = !judge;
}
let allLetters = false;
$("hLetters").onclick = e => { if (e.target.closest("[data-all]")) { allLetters = true; renderHome(); return; } const b = e.target.closest("[data-l]"); if (b) { judge = b.dataset.l; renderHome(); } };
$("hGo").onclick = () => { if (!judge) return; store.set("ac_j_judge", judge); showScreen("list"); renderList(); };
$("lBack").onclick = () => showHome();

function renderList() {
  $("lJ").textContent = judge;
  const mine = [...comps.values()].filter(c => compState(c) !== "done" && juryLetters(c).includes(judge));
  const order = { live: 0, ready: 1 };
  mine.sort((a, b) => order[compState(a)] - order[compState(b)] || (b.startedAt || b.createdAt || 0) - (a.startedAt || a.createdAt || 0));
  const fmtD = ms => ms ? new Date(ms).toLocaleDateString("cs-CZ", { day: "numeric", month: "numeric", year: "numeric" }) : "";
  $("compList").innerHTML = !compsLoaded ? `<div class="center">Načítám…</div>`
    : mine.length ? mine.map(c => {
      const st = compState(c);
      return `<button class="ccard ${st === "live" ? "live" : ""}" data-comp="${esc(c.id)}">
        <span class="cbadge">${st === "live" ? `<span class="dot"></span>Probíhá` : "Připravuje se"}</span>
        <b>${esc(c.name || c.id)}</b>
        <div class="m">Jste zapsán/a jako <b style="display:inline;font-size:13px">${judge}</b>${c.jury[judge] ? ` · ${esc(c.jury[judge])}` : ""}<br>${st === "live" ? `Zahájeno ${fmtD(c.startedAt)}` : `Založeno ${fmtD(c.createdAt)}`}</div></button>`;
    }).join("")
    : `<div class="center" style="padding:30px 10px">Pro porotce <b style="color:var(--text)">${judge}</b> teď není otevřená žádná akce.<br>Zkontrolujte písmeno, nebo se zeptejte sčitatele.</div>`;
  const others = [...comps.values()].filter(c => compState(c) !== "done" && !juryLetters(c).includes(judge))
    .sort((a, b) => order[compState(a)] - order[compState(b)] || (b.startedAt || b.createdAt || 0) - (a.startedAt || a.createdAt || 0));
  if (compsLoaded && others.length) $("compList").innerHTML += `<div class="kicker" style="margin-top:28px">Ostatní akce</div>`
    + others.map(c => `<div class="ccard other"><span class="cbadge">${compState(c) === "live" ? "Probíhá" : "Připravuje se"}</span>
      <b>${esc(c.name || c.id)}</b><div class="m">Porota ${juryLetters(c).join(", ") || "–"} · porotce ${judge} zde nehodnotí</div></div>`).join("");
}
$("compList").onclick = e => { const b = e.target.closest("[data-comp]"); if (b) { comp = b.dataset.comp; start(); } };

let compsLoaded = false, compsListening = false;
function bootApp() {
  showHome();
  onAuthStateChanged(auth, user => {
    if (!user || compsListening) return; compsListening = true;
    onSnapshot(collection(db, "competitions"), snap => {
      comps = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }])); compsLoaded = true;
      if (screen === "home") renderHome(); if (screen === "list") renderList();
    }, err => { $("homeSub").textContent = "Akce se nenačetly: " + errText(err); toast("Akce se nenačetly", errText(err)); });
  });
  signInAnonymously(auth).catch(e => { $("homeSub").textContent = "Přihlášení selhalo: " + e.code; });
}

// Každý telefon má své ID. Písmeno porotce „drží“ jen jedno zařízení; druhé se musí výslovně převzít.
const deviceId = (() => { let d = store.get("ac_device"); if (!d) { d = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); store.set("ac_device", d); } return d; })();
let holder = true;
async function claimLetter(force) {
  if (!force) {
    try {
      const snap = await Promise.race([getDoc(judgeRef()), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 4000))]);
      const d = snap.data();
      if (d?.devices?.[deviceId]?.kicked) { kicked = true; holder = false; return "kicked"; }
      // nezávisle na hodinách telefonu: drží-li písmeno jiné zařízení, vždy se zeptáme
      if (d?.deviceId && d.deviceId !== deviceId) {
        const ok = await askTakeover();
        if (ok) { diagInc("takeovers"); diagEvent("převzetí písmene"); }
        if (!ok) { location.href = location.pathname + (linkComp ? `?c=${encodeURIComponent(linkComp)}` : ""); return false; }
      }
    } catch {}                         // bez spojení: převezmeme (zápis se odešle po připojení)
  }
  holder = true;
  if (force) { diagInc("takeovers"); diagEvent("převzetí písmene"); }
  setDoc(judgeRef(), { letter: judge, deviceId, claimedAt: serverTimestamp(), lastSeen: serverTimestamp(), devices: { [deviceId]: devEntry() } }, { merge: true }).catch(() => {});
  return true;
}
// ----- správa zařízení (v4.1): každý telefon hlásí sčitateli, kde je -----
let kicked = false, lastPhase = "", phaseTimer = null;
function deviceModel() {
  const ua = navigator.userAgent;
  let m = ua.match(/iPhone OS (\d+)/); if (m) return `iPhone · iOS ${m[1]}`;
  m = ua.match(/iPad|Macintosh.*Mobile/); if (m || (navigator.maxTouchPoints > 1 && /Macintosh/.test(ua))) return "iPad";
  m = ua.match(/Android [\d.]+; ([^;)]+?)(?: Build|\))/); if (m) return m[1].trim().slice(0, 30);
  if (/Android/.test(ua)) return "Android";
  const br = /Edg\//.test(ua) ? "Edge" : /Chrome\//.test(ua) ? "Chrome" : /Firefox\//.test(ua) ? "Firefox" : /Safari\//.test(ua) ? "Safari" : "Prohlížeč";
  return `${br} · ${/Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : /Linux/.test(ua) ? "Linux" : "počítač"}`;
}
function phaseText() {
  if (kicked) return "odpojeno sčitatelem";
  if (!holder) return "záložní – písmeno drží jiné zařízení";
  if (!$("overlay").innerHTML && document.visibilityState !== "visible") return "na pozadí";
  const r = rounds.get(rid);
  if (!r) return "čeká na kolo";
  if (r.status !== "open") return `${titleOf(r)} · kolo uzavřeno`;
  if (settings().requireReady && me.readyFor !== r.id) return `${titleOf(r)} · nepotvrdil připravenost`;
  const sent = r.dances.filter(d => sheets.get(d)).length;
  return `${titleOf(r)} · ${DANCES[dance] || ""} · odesláno ${sent}/${r.dances.length}${$("overlay").innerHTML.includes("qrwrap") ? " · ukazuje QR" : ""}`;
}
function devEntry() { return { at: serverTimestamp(), phase: phaseText(), model: deviceModel(), ver: APP_VER }; }
function phaseTick() {
  if (sim || !comp || !judge || $("app").classList.contains("hidden")) return;
  const ph = phaseText(); if (ph === lastPhase) return;
  lastPhase = ph; clearTimeout(phaseTimer);
  phaseTimer = setTimeout(() => { if (online && !offStart) setDoc(judgeRef(), { devices: { [deviceId]: devEntry() } }, { merge: true }).catch(() => {}); }, 4000);
}
function showKicked() {
  $("tabs").classList.add("hidden"); $("footer").classList.add("hidden"); $("roundBar").classList.add("hidden");
  $("content").innerHTML = `<div class="center"><h2>Zařízení bylo odpojeno</h2>Sčitatel odpojil toto zařízení od hodnocení porotce <b style="color:var(--text)">${judge}</b>.<br>Pokud jde o omyl, požádejte sčitatele, aby zařízení znovu povolil (Podpora → Správa zařízení).
    <button class="btn" id="kickHome">Zpět na úvod</button></div>`;
  $("kickHome").onclick = () => { location.href = location.pathname + (linkComp ? `?c=${encodeURIComponent(linkComp)}` : ""); };
}
function askTakeover() {
  return new Promise(res => {
    $("overlay").innerHTML = `<div class="overlay"><div class="sheet"><h3>Porotce ${judge} je přihlášen jinde</h3>
      <p>Písmeno ${judge} je přihlášené na jiném zařízení. Hodnotit může vždy jen jedno zařízení.<br>Pokud jste to vy na jiném telefonu, můžete hodnocení převzít sem.</p>
      <div style="display:flex;gap:8px"><button class="btn" style="flex:1;height:46px" id="toNo">Zpět</button><button class="btn primary" style="flex:1;height:46px" id="toYes">Převzít sem</button></div></div></div>`;
    $("toNo").onclick = () => { $("overlay").innerHTML = ""; res(false); };
    $("toYes").onclick = () => { $("overlay").innerHTML = ""; res(true); };
  });
}

let liveStarted = false;
function start() {
  store.set("ac_j_judge", judge);
  showScreen("app");
  $("hJudge").textContent = judge;
  $("hJudge").onclick = goHome;
  requestWakeLock();
  if (memCache) toast("Prohlížeč neukládá offline", "Nezavírejte stránku, dokud lístek neukazuje „Uloženo na serveru“.");
  const go = async () => { if (liveStarted) return; liveStarted = true; if (await claimLetter(false)) listen(); };
  if (auth.currentUser) go(); else onAuthStateChanged(auth, u => { if (u) go(); });
}

// ===================== PŘIPOJENÍ, PŘÍTOMNOST =====================
function setConn(cls, text) { if (sim) { cls = "wait"; text = "Simulátor"; } $("connDot").className = "dot " + cls; $("connText").textContent = text; }
function updateConn() { if (!online) setConn("bad", "Offline"); else if (!serverConnected) setConn("wait", "Připojování"); else setConn("ok", "Online"); }
addEventListener("online", () => { online = true; updateConn(); });
addEventListener("offline", () => { online = false; updateConn(); });
let wakeLock = null, wakeWarned = false;
// Displej musí zůstat rozsvícený; když to telefon neumí, porotce dostane jednorázovou radu.
async function requestWakeLock() {
  let ok = false;
  try { if (navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); ok = true; } } catch {}
  diagSet({ wake: ok });
  if (!ok && !wakeWarned && document.visibilityState === "visible") {
    wakeWarned = true;
    toast("Telefon může zhasínat displej", "Nastavte automatický zámek na „Nikdy“ (iPhone: Nastavení → Zobrazení a jas; Android: Displej → Časový limit) a nechte aplikaci otevřenou.");
  }
}

// ----- deník přenosu (v4.0): měří telefon sám, sčitatel ho vidí v „Deník přenosu“ -----
let diag = {}, diagFor = null;
const diagKey = () => `ac_diag_${comp}_${judge}`;
function diagLoad() { diagFor = diagKey(); try { diag = JSON.parse(store.get(diagFor) || "{}") || {}; } catch { diag = {}; } }
function diagReady() { if (diagFor !== diagKey()) diagLoad(); }
function diagSave() { if (sim || !comp || !judge) return; store.set(diagKey(), JSON.stringify(diag)); }
function diagSet(o) { diagReady(); Object.assign(diag, o); diagSave(); }
function diagInc(k, by = 1) { diagReady(); diag[k] = (diag[k] || 0) + by; diagSave(); }
function diagEvent(e) { diagReady(); diag.events = [...(diag.events || []), { t: Date.now(), e }].slice(-15); diagSave(); }
let everConnected = false, offStart = null;
function trackConn(connected) {
  if (sim) return;
  if (connected) {
    if (offStart) { const ms = Date.now() - offStart; diagInc("offMs", ms); diagEvent(`spojení obnoveno po ${Math.round(ms / 1000)} s`); offStart = null; beat(); }
    everConnected = true;
  } else if (everConnected && !offStart) { offStart = Date.now(); diagInc("offCount"); diagEvent("výpadek spojení"); }
}
const judgeRef = () => doc(db, "competitions", comp, "judges", judge);
// Tep jednou za minutu a jen se signálem (bez signálu by se zbytečně řadil do fronty).
// Záložní zařízení (písmeno drží jiné) hlásí jen svůj záznam v seznamu zařízení.
function beat() {
  if (document.visibilityState !== "visible") return;
  if (!online || offStart || kicked) return;
  lastPhase = phaseText();
  const dev = { devices: { [deviceId]: devEntry() } };
  if (!holder) { setDoc(judgeRef(), dev, { merge: true }).catch(() => {}); return; }
  setDoc(judgeRef(), { letter: judge, uid: auth.currentUser?.uid || null, lastSeen: serverTimestamp(), ver: APP_VER, diag, ...dev }, { merge: true }).catch(() => {});
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { requestWakeLock(); beat(); } });

let roundsSig = null, seenOpen = null;
function listen() {
  diagReady(); beat(); setInterval(beat, 60000);
  let meSig = null;
  onSnapshot(judgeRef(), snap => {
    liveMe = snap.data() || {};
    const wasKicked = kicked;
    kicked = liveMe.devices?.[deviceId]?.kicked === true;
    holder = !kicked && (!liveMe.deviceId || liveMe.deviceId === deviceId);
    if (kicked && !wasKicked) { diagEvent("odpojeno sčitatelem"); navigator.vibrate?.([300, 100, 300]); }
    if (!kicked && wasKicked) { toast("Zařízení povoleno", "Sčitatel vás znovu připojil."); lastPhase = ""; }
    const sig = JSON.stringify([holder, kicked, liveMe.readyFor ?? null]);      // tep (lastSeen) nepřekresluje obrazovku
    if (!sim) { me = liveMe; if (sig !== meSig) { meSig = sig; render(); } }
  });
  onSnapshot(doc(db, "competitions", comp), snap => {
    compDoc = snap.data() || {};
    const name = compDoc.jury?.[judge];
    if (!sim) $("hSub").textContent = [name, compDoc.name || comp].filter(Boolean).join(" · ");
    render();
  });
  onSnapshot(collection(db, "competitions", comp, "rounds"), { includeMetadataChanges: true }, snap => {
    serverConnected = !snap.metadata.fromCache; updateConn(); trackConn(serverConnected);
    const fresh = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(validRound);
    // potvrzení jiných porotců a metadata nepřekreslují obrazovku
    const sig = JSON.stringify(fresh.map(r => { const { acks, ackAt, ...rest } = r; return [rest, r.judges.includes(judge) ? Object.entries(acks || {}).filter(([k]) => k.endsWith("_" + judge)).sort() : null]; }));
    if (sig === roundsSig) return;
    roundsSig = sig;
    allRounds = fresh;
    liveRounds = new Map(allRounds.filter(r => r.judges.includes(judge)).map(r => [r.id, r]));
    const openNow = [...liveRounds.values()].filter(r => r.status === "open");
    if (seenOpen) for (const r of openNow) if (!seenOpen.has(r.id) && !sim) { navigator.vibrate?.([220, 120, 220]); toast("Nové kolo", `${r.category || ""} · ${r.label}`); diagEvent(`nové kolo ${r.label}`); }
    seenOpen = new Set(openNow.map(r => r.id));
    if (sim) return;
    rounds = liveRounds;
    const o = openRounds(), cur = rounds.get(rid);
    if ((!cur || cur.status !== "open") && o[0]) selectRound(o[0].id);
    else { if (!cur) rid = null; render(); }
  }, err => { setConn("bad", "Chyba spojení"); toast("Kola se nenačetla", errText(err)); });
}
const openRounds = () => [...rounds.values()].filter(r => r.status === "open").sort((a, b) => (b.created || 0) - (a.created || 0));

function selectRound(id) {
  rid = id; const r = rounds.get(id); dance = r.dances[0]; selC = selP = null;
  sheets.clear(); unsubSheets?.(); unsubSheets = null;
  if (sim) { render(); return; }
  unsubSheets = onSnapshot(query(collection(db, "competitions", comp, "rounds", id, "sheets"), where("judge", "==", judge)),
    { includeMetadataChanges: true },
    snap => { if (sim) return; sheets = new Map(snap.docs.map(d => [d.data().dance, { data: d.data(), pending: d.metadata.hasPendingWrites }])); render(); },
    err => toast("Lístky se nenačetly", errText(err)));
  render();
}
$("roundSel").onchange = e => selectRound(e.target.value);

// ===================== KONCEPT HODNOCENÍ =====================
function draftFor(r, d) {
  const key = `${r.id}|${d}`;
  if (!drafts.has(key) || !drafts.get(key).dirty) {
    const s = sheets.get(d)?.data;
    drafts.set(key, r.type === "prelim"
      ? { dirty: false, marks: new Set(Array.isArray(s?.marks) ? s.marks.filter(c => r.couples.includes(c)) : []) }
      : { dirty: false, assign: s?.placings && typeof s.placings === "object" ? Object.fromEntries(Object.entries(s.placings).filter(([c, p]) => r.couples.includes(+c) && Number.isInteger(p))) : {} });
  }
  return drafts.get(key);
}
const acked = (r, d) => { const s = sheets.get(d)?.data; return !!s && Number.isInteger(s.rev) && (r.acks?.[`${d}_${judge}`] || 0) >= s.rev; };
const isValid = (r, dr) => {
  if (r.type === "prelim") return dr.marks.size === r.required;
  const n = r.couples.length, pv = Object.values(dr.assign);
  return pv.length === n && new Set(pv).size === n && pv.every(p => Number.isInteger(p) && p >= 1 && p <= n);
};
function sameAsSheet(r, dr, s) {
  if (!s) return false;
  if (r.type === "prelim") { const m = Array.isArray(s.marks) ? s.marks : []; return m.length === dr.marks.size && m.every(x => dr.marks.has(x)); }
  const a = Object.entries(dr.assign).map(([c, p]) => `${c}:${p}`).sort().join(), b = Object.entries(s.placings || {}).map(([c, p]) => `${c}:${p}`).sort().join();
  return a === b;
}
// odstoupení (v4.1): withdrawn[<soutěže>][<číslo>] v dokumentu akce
const isWd = (r, c) => !sim && !!compDoc.withdrawn?.[r.categoryId]?.[String(c)];
// barevné značky (jen v telefonu porotce)
const markKey = () => `ac_mk_${sim ? "sim" : comp}_${rid}_${dance}`;
const getMarks = () => { try { return JSON.parse(store.get(markKey()) || "{}"); } catch { return {}; } };
const setMarks = m => store.set(markKey(), JSON.stringify(m));

// ===================== VYKRESLENÍ =====================
function render() {
  if ($("app").classList.contains("hidden")) return;
  const r = rounds.get(rid), st = settings();
  const list = [...rounds.values()].sort((a, b) => (b.created || 0) - (a.created || 0));
  $("roundBar").classList.toggle("hidden", openRounds().length < 2);
  $("roundSel").innerHTML = list.filter(x => x.status === "open" || x.id === rid).map(x => `<option value="${x.id}" ${x.id === rid ? "selected" : ""}>${esc(titleOf(x))}${x.status !== "open" ? " (uzavřeno)" : ""}</option>`).join("");
  $("readyRow").classList.toggle("hidden", !(r && r.status === "open" && me.readyFor === r.id));
  if (!sim && kicked) { showKicked(); phaseTick(); return; }
  if (!sim && !holder) {
    phaseTick();
    $("tabs").classList.add("hidden"); $("footer").classList.add("hidden"); $("roundBar").classList.add("hidden");
    $("content").innerHTML = `<div class="center"><h2>Převzato jiným zařízením</h2>Hodnocení porotce <b style="color:var(--text)">${judge}</b> teď probíhá na jiném telefonu nebo tabletu. Z tohoto zařízení nelze odesílat.
      <button class="btn primary" id="takeBack">Převzít zpět sem</button></div>`;
    $("takeBack").onclick = async () => { if (await askTakeover()) { await claimLetter(true); render(); } };
    return;
  }
  if (!r) {
    $("tabs").classList.add("hidden"); $("footer").classList.add("hidden");
    $("hRound").textContent = "Čekám na kolo…";
    const others = sim ? [] : allRounds.filter(x => x.status === "open" && !x.judges?.includes(judge));
    const info = sim ? "" : others.length
      ? `<div style="margin-top:18px;font-size:13px;line-height:1.6">Právě probíhá:<br>${others.map(x => `<b style="color:var(--text)">${esc(titleOf(x))}</b> – hodnotí ${(x.judges || []).join(", ")}`).join("<br>")}<br>Porotce ${judge} v tomto kole není. Pokud to nesedí, ozvěte se sčitateli.</div>`
      : `<div style="margin-top:18px;font-size:13px">Sčitatel zatím nespustil žádné kolo.</div>`;

      ${r.type === "final" ? "Finále – určíte pořadí párů" : `Postupové kolo – označíte ${r.required} párů`}<br>

  $("clearBtn").textContent = s && dr.dirty && !same ? "Vrátit" : "Smazat";
  let stt;

}

function renderPrelim(r, dr, banner, locked, st) {
  const marks = st.colorMarks ? getMarks() : {};
  const groups = r.groups?.length ? r.groups : [{ n: 1, couples: r.couples }];
  // odstoupivší: nejde označit; neodeslaný křížek u něj se zruší
  for (const c of [...dr.marks]) if (isWd(r, c) && !locked) { dr.marks.delete(c); dr.dirty = true; }
  const btn = c => isWd(r, c) ? `<button class="couple wd" disabled>${c}</button>` : `<button class="couple ${dr.marks.has(c) ? "on" : ""} ${marks[c] === "g" ? "mg" : marks[c] === "r" ? "mr" : ""}" data-c="${c}" ${locked ? "disabled" : ""}>${c}</button>`;
  $("content").innerHTML = banner +
    groups.map(g => `${groups.length > 1 ? `<div class="ghead"><span class="gc">${g.n}. skupina</span> ${g.couples.length}</div>` : ""}<div class="grid">${g.couples.map(btn).join("")}</div>`).join("");

}
// Tlačítka párů se zvětší/zmenší, aby se vešla na obrazovku; pod pohodlné minimum (44 px) nejdou – pak se posouvá.
function fitPrelim() {
  const el = $("content"), grids = [...el.querySelectorAll(".grid")]; if (!grids.length) return;
  const cols = getComputedStyle(grids[0]).gridTemplateColumns.split(" ").length || 4;
  let rows = 0, gaps = 0;
  grids.forEach(g => { const n = Math.ceil(g.children.length / cols); rows += n; gaps += (n - 1) * 8; });
  let fixed = 0;
  [...el.children].filter(c => !c.classList.contains("grid")).forEach(c => { const cs = getComputedStyle(c); fixed += c.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom); });
  const cs = getComputedStyle(el), avail = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - fixed - gaps - 2;
  const h = Math.max(44, Math.min(78, Math.floor(avail / rows)));

}

function renderFinal(r, dr, banner, locked, st) {
  const N = r.couples.length, byPlace = {};
  for (const [c, p] of Object.entries(dr.assign)) byPlace[p] = +c;
  const medal = p => p >= 1 && p <= 3 ? `<span class="medal m${p}"></span>` : "";
  $("content").innerHTML = banner +
    `<div class="fin" id="fin">
      <div class="fcol" style="grid-template-rows:repeat(${N},1fr)">${r.couples.map(c => `<button class="fbtn ${dr.assign[c] ? "linked" : ""} ${selC === c ? "sel" : ""}" data-fc="${c}" ${locked ? "disabled" : ""}>${medal(dr.assign[c])}${c}${dr.assign[c] ? `<span class="sm">${dr.assign[c]}.</span>` : ""}${isWd(r, c) ? `<span class="wdl">odstoupil</span>` : ""}</button>`).join("")}</div>
      <div class="fcol" style="grid-template-rows:repeat(${N},1fr)">${Array.from({ length: N }, (_, i) => i + 1).map(p => `<button class="fbtn pl ${byPlace[p] ? "linked" : ""} ${selP === p ? "sel" : ""}" data-fp="${p}" ${locked ? "disabled" : ""}>${medal(p)}${p}.</button>`).join("")}</div>
      <svg id="lines"></svg></div>`;
  fitFinal(N);
  requestAnimationFrame(drawLines);
}
function fitFinal(N) {
  const el = $("content"), fin = $("fin"); if (!fin) return;
  let fixed = 0; [...el.children].filter(c => c !== fin).forEach(c => { const cs = getComputedStyle(c); fixed += c.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom); });
  const cs = getComputedStyle(el), avail = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - fixed - 2;
  fin.style.height = Math.max(avail, N * 44 + (N - 1) * 8) + "px";
}
let drawnLinks = new Set();               // už vykreslená spojení – animuje se jen nové
function drawLines() {
  const fin = $("fin"), svg = $("lines"); if (!fin || !svg) return;
  const r = rounds.get(rid); if (!r || r.type !== "final") return;
  const dr = draftFor(r, dance), box = fin.getBoundingClientRect();
  const W = box.width, now = new Set();
  const defs = `<defs><linearGradient id="lnGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="${W}" y2="0">
    <stop offset="0" stop-color="#f5d3a8"/><stop offset="1" stop-color="#ffe9cc"/></linearGradient></defs>`;
  svg.innerHTML = defs + Object.entries(dr.assign).map(([c, p]) => {
    const a = fin.querySelector(`[data-fc="${c}"]`)?.getBoundingClientRect(), b = fin.querySelector(`[data-fp="${p}"]`)?.getBoundingClientRect();
    if (!a || !b) return "";
    const x1 = a.right - box.left + 1, y1 = a.top + a.height / 2 - box.top, x2 = b.left - box.left - 1, y2 = b.top + b.height / 2 - box.top;
    const k = (x2 - x1) * .5, d = `M${x1},${y1} C${x1 + k},${y1} ${x2 - k},${y2} ${x2},${y2}`;   // plynulá S-křivka
    const key = `${dance}:${c}-${p}`, nw = drawnLinks.has(key) ? "" : "new"; now.add(key);

    return `<path class="ln-glow ${cl}" d="${d}"/><path class="ln ${cl}" d="${d}"/><circle class="end ${cl}" cx="${x1}" cy="${y1}" r="4"/><circle class="end ${cl}" cx="${x2}" cy="${y2}" r="4"/>`;

}
addEventListener("resize", () => { const r = rounds.get(rid); if (r?.type === "final") { fitFinal(r.couples.length); requestAnimationFrame(drawLines); } else fitPrelim(); });

// ===================== OVLÁDÁNÍ =====================
$("tabs").addEventListener("click", e => { const t = e.target.closest("[data-d]"); if (t) { dance = t.dataset.d; selC = selP = null; render(); } });

// postupová kola: ťuknutí = křížek, posun doleva/doprava = barevná značka
let ptr = null;
$("content").addEventListener("pointerdown", e => {
  const b = e.target.closest(".couple"); if (!b || b.disabled) return;
  ptr = { b, c: +b.dataset.c, x: e.clientX, y: e.clientY, id: e.pointerId };
});
$("content").addEventListener("pointermove", e => {
  if (!ptr || e.pointerId !== ptr.id || !settings().colorMarks) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  if (Math.abs(dx) > Math.abs(dy)) ptr.b.style.transform = `translateX(${Math.max(-18, Math.min(18, dx * .35))}px)`;
});
const endPtr = (e, cancel) => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const { b, c, x, y } = ptr; ptr = null; b.style.transform = "";
  if (cancel) return;
  const dx = e.clientX - x, dy = e.clientY - y, r = rounds.get(rid);
  if (!r || r.type !== "prelim" || r.status !== "open") return;
  if (settings().colorMarks && Math.abs(dx) > 30 && Math.abs(dx) > Math.abs(dy) * 1.3) {
    const m = getMarks(), col = dx > 0 ? "g" : "r";
    if (m[c] === col) delete m[c]; else m[c] = col;
    setMarks(m); navigator.vibrate?.(15); render(); return;
  }
  if (Math.abs(dx) < 14 && Math.abs(dy) < 14) {
    const dr = draftFor(r, dance);
    if (dr.marks.has(c)) dr.marks.delete(c);

$("content").addEventListener("pointerup", e => endPtr(e, false));
$("content").addEventListener("pointercancel", e => endPtr(e, true));
function flash(b) { b.animate([{ transform: "translateX(-4px)" }, { transform: "translateX(4px)" }, { transform: "none" }], { duration: 180 }); }

// finále: pár → místo
$("content").addEventListener("click", e => {
  const r = rounds.get(rid); if (!r || r.type !== "final" || r.status !== "open") return;
  const fc = e.target.closest("[data-fc]"), fp = e.target.closest("[data-fp]");
  if (!fc && !fp) return;
  if (fc) { const c = +fc.dataset.fc; if (selP) { link(r, c, selP); return; } selC = selC === c ? null : c; render(); }
  if (fp) { const p = +fp.dataset.fp; if (selC) { link(r, selC, p); return; } selP = selP === p ? null : p; render(); }
});
function link(r, c, p) {
  const dr = draftFor(r, dance);
  if (dr.assign[c] === p) delete dr.assign[c];                // stejné spojení = zrušit
  else {
    for (const [k, v] of Object.entries(dr.assign)) if (v === p) delete dr.assign[k];   // místo uvolnit
    dr.assign[c] = p;
  }
  dr.dirty = true; selC = selP = null; navigator.vibrate?.(15); render();
}

$("clearBtn").onclick = () => {
  const r = rounds.get(rid); if (!r) return;
  const dr = draftFor(r, dance), s = sheets.get(dance)?.data;
  if (s && dr.dirty && !sameAsSheet(r, dr, s)) { drafts.delete(`${r.id}|${dance}`); selC = selP = null; render(); return; }   // Vrátit k odeslané verzi

};

let sending = false;
$("sendBtn").onclick = () => {
  if (sending) return;
  const r = rounds.get(rid); if (!r) return;
  const dr = draftFor(r, dance);
  if (r.status !== "open" || !isValid(r, dr) || sameAsSheet(r, dr, sheets.get(dance)?.data)) return;
  sending = true; $("sendBtn").disabled = true; setTimeout(() => { sending = false; render(); }, 600);
  if (!sim && !holder) { toast("Nelze odeslat", "Hodnocení převzalo jiné zařízení."); return; }
  const prev = sheets.get(dance)?.data;
  const data = { judge, dance, type: r.type, uid: auth.currentUser?.uid || null, deviceId, clientAt: Date.now(), sentAt: serverTimestamp(), source: "app", writer: "porotce" };
  if (r.type === "prelim") data.marks = [...dr.marks].sort((a, b) => a - b);
  else data.placings = Object.fromEntries(Object.entries(dr.assign).map(([c, p]) => [String(c), p]));
  // záloha konceptu – kdyby server zápis odmítl (např. kolo mezitím uzavřené), hodnocení se neztratí
  const d0 = dance, key = `${r.id}|${d0}`;
  const backup = r.type === "prelim" ? { dirty: true, marks: new Set(data.marks) } : { dirty: true, assign: { ...dr.assign } };
  if (sim) {

    setTimeout(() => { const x = sheets.get(d0); if (x) { x.pending = false; r.acks = { ...(r.acks || {}), [`${d0}_${judge}`]: x.data.rev }; } render(); }, 700);
  } else {
    const b = writeBatch(db);
    b.set(doc(db, "competitions", comp, "rounds", rid, "sheets", `${d0}_${judge}`), { ...data, rev: increment(1) });   // revizi zvyšuje server
    b.set(doc(collection(db, "competitions", comp, "log")), { at: serverTimestamp(), ts: data.clientAt, who: `porotce ${judge}`, action: "odeslání lístku",
      round: rid, dance: d0, judge, deviceId, ...(r.type === "prelim" ? { marks: data.marks } : { placings: data.placings }) });
    const t0 = Date.now(); diagInc("sends");
    b.commit().then(() => { const dt = Date.now() - t0; diagReady(); diag.delivered = (diag.delivered || 0) + 1; diag.deliverSum = (diag.deliverSum || 0) + dt; diag.deliverMax = Math.max(diag.deliverMax || 0, dt); diagSave(); if (dt > 10000) diagEvent(`lístek ${DANCES[d0] || d0} doručen až po ${Math.round(dt / 1000)} s`); })
    .catch(e => {

      else toast("Lístek se neodeslal", `${errText(e)} Vaše rozpracovaná oprava zůstala – dokončete ji a odešlete znovu.`);

};

// ===================== QR OFFLINE =====================
// AC2;c=<akce>;r=<kolo>;j=<porotce>;t=p|f;ts=<ms>;v=S2.C1;S=1.4.7;C=...  (v = revize lístků na serveru, ze kterých telefon vychází)
// Tanec s rozpracovanou (neúplnou) opravou – QR by obsahoval staré hodnocení, proto ho nevytvoříme.
function qrBlocked(r) {
  return r.dances.find(d => { const dr = drafts.get(`${r.id}|${d}`), s = sheets.get(d)?.data; return dr && dr.dirty && !isValid(r, dr) && !sameAsSheet(r, dr, s); }) || null;
}
function qrPayload(r) {
  if (qrBlocked(r)) return null;
  const parts = ["AC2", `c=${sim ? "simulace" : comp}`, `r=${r.id}`, `j=${judge}`, `t=${r.type === "final" ? "f" : "p"}`, `ts=${Date.now()}`,
    `v=${r.dances.map(d => d + (Number.isInteger(sheets.get(d)?.data?.rev) ? sheets.get(d).data.rev : 0)).join(".")}`];   // revize, ze kterých telefon vychází
  for (const d of r.dances) {
    const dr = draftFor(r, d), s = sheets.get(d)?.data;
    let nums = null;
    if (isValid(r, dr)) nums = r.type === "prelim" ? [...dr.marks].sort((a, b) => a - b) : Object.entries(dr.assign).sort((a, b) => a[1] - b[1]).map(([c]) => +c);
    else if (s && Array.isArray(s.marks) && r.type === "prelim") nums = s.marks;
    else if (s && s.placings && r.type === "final") nums = Object.entries(s.placings).sort((a, b) => a[1] - b[1]).map(([c]) => +c);
    if (!nums) return null;
    parts.push(`${d}=${nums.join(".")}`);
  }
  return parts.join(";");
}
function qrSvg(text) {
  const qr = window.qrcode(0, "M"); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), q = 4, size = n + q * 2;

}

  if (window.qrcode) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js";
    sc.onload = () => window.qrcode ? res() : rej(new Error("Knihovna QR se nenačetla.")); sc.onerror = () => { sc.remove(); rej(new Error("Knihovna QR se nenačetla – chybí internet.")); }; document.head.appendChild(sc); });
}
$("qrBtn").onclick = async () => {
  const r = rounds.get(rid); if (!r) return;
  const blk = qrBlocked(r);
  if (blk) { toast("QR teď nejde vytvořit", `V tanci ${DANCES[blk]} máte rozpracovanou opravu. Dokončete ji, nebo ji vraťte tlačítkem Vrátit.`); return; }
  const text = qrPayload(r);

  if (!sim) { diagInc("qr"); diagEvent(`QR ${r.label}`); }
  try { await loadQrLib(); } catch {}
  let inner;
  try { inner = window.qrcode ? `<div class="qrwrap">${qrSvg(text)}</div>` : `<p style="color:#ff8a8d">Knihovna QR se nenačetla. Připojte se na chvíli k internetu a zkuste to znovu.</p>`; }
  catch (e) { inner = `<p style="color:#ff8a8d">QR se nepodařilo vytvořit: ${esc(e.message)}</p>`; }
  $("overlay").innerHTML = `<div class="overlay"><div class="sheet"><h3>Porotce ${judge} · ${esc(titleOf(r))}</h3>
    <p>Celé kolo (${r.dances.map(d => DANCES[d]).join(", ")}). Ukažte kód sčitateli, nebo ho vyfoťte a fotku mu pošlete.</p>
    ${inner}<button class="btn primary" style="width:100%;margin-top:14px;height:46px" id="qrClose">Zavřít</button></div></div>`;
  $("qrClose").onclick = () => $("overlay").innerHTML = "";

// ===================== NÁVRAT NA HOMESCREEN =====================
// Uprostřed hodnocení (otevřené kolo, neodeslané nebo nevyplněné tance) se nejdřív zeptá.
function midEvaluation() {

}

// ===================== SIMULÁTOR =====================
function simRound(kind) {
  if (kind === "final") return { id: "sim-final", category: "Simulátor", label: "Finále", type: "final", dances: ["S","C","R","P","J"],
    couples: [12, 17, 23, 31, 40, 45], judges: [judge], required: null, status: "open", created: Date.now() };
  const couples = Array.from({ length: 24 }, (_, i) => i + 1);
  return { id: "sim-prelim", category: "Simulátor", label: "1. kolo", type: "prelim", dances: ["S","C","R"], couples, judges: [judge], required: 12,
    groups: [{ n: 1, couples: couples.slice(0, 8) }, { n: 2, couples: couples.slice(8, 16) }, { n: 3, couples: couples.slice(16) }], status: "open", created: Date.now() };
}
function startSim(kind) {
  const from = screen === "app" ? "live" : "home";
  if (!judge) judge = "A";
  sim = { from };
  showScreen("app");
  $("hJudge").textContent = judge; $("hSub").textContent = "Zkušební kolo – nic se neodesílá";
  setConn("wait", "Simulátor");
  const r = simRound(kind);
  rounds = new Map([[r.id, r]]); me = { ...me, readyFor: null };
  for (const k of [...drafts.keys()]) if (k.startsWith("sim-")) drafts.delete(k);
  try { for (const d of r.dances) localStorage.removeItem(`ac_mk_sim_${r.id}_${d}`); } catch {}
  selectRound(r.id);
}
function exitSim() {
  const from = sim?.from; sim = null; sheets.clear(); rid = null; selC = selP = null;
  if (from === "home") { showHome(); return; }
  me = liveMe; rounds = liveRounds; updateConn();
  $("hSub").textContent = [compDoc.jury?.[judge], compDoc.name || comp].filter(Boolean).join(" · ");
  const o = openRounds(); if (o[0]) selectRound(o[0].id); else render();
}
document.addEventListener("click", e => {
  const s = e.target.closest("[data-sim]"); if (s) { startSim(s.dataset.sim); return; }
  if (e.target.closest("[data-simexit]")) exitSim();
});

// ===================== START =====================
bootApp();
</script>
